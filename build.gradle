plugins {
    id 'fabric-loom' version '1.13.6' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

subprojects {
    if (name != 'common') {
        version = "${rootProject.version}+${name}.${minecraft_version}"
    }
}

tasks.register('buildBenchmark') {
    group = 'build'
    description = 'Builds loader jars that keep the benchmark command and the render profiler.'
    dependsOn subprojects.findAll { it.name != 'common' }.collect { "${it.path}:build" }
}
